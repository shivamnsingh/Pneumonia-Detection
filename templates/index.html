<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pneumonia Detection</title>
    <style>
        body {
            background-color: #252525;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 16px;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            line-height: 1.3;
            margin: 40px auto 60px;
            max-width: 900px;
        }
        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 24px;
        }
        input[type="file"] {
            background: #ffffff;
            border: 1px solid #000;
            border-radius: 4px;
            padding: 6px;
            font-size: 1rem;
            max-width: 100%;
        }
        button {
            background-color: #2a9d8f;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 28px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #21867a;
        }
        .result {
            margin-top: 40px;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .file-name {
            color: #cccccc;
            margin-top: 10px;
        }
        #preview {
            display: none;
            max-width: 300px;
            max-height: 300px;
            margin: 16px auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Deep Learning approach to Pneumonia Detection and Classification from Chest X-Ray</h1>

    <h2>Please Upload an X-ray Image</h2>

    <form action="/predict" method="post" enctype="multipart/form-data">
        <input type="file" name="file" id="file" accept="image/*" required>
        <div id="file-name" class="file-name">No file chosen</div>
        <img id="preview" alt="Selected X-ray">
        <br>
        <button type="submit">Predict</button>
    </form>

    {% if result %}
    <div class="result">{{ result }}</div>
    {% endif %}

    <script>
        const fileInput = document.getElementById('file');
        const fileName = document.getElementById('file-name');
        const preview = document.getElementById('preview');

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) {
                fileName.textContent = 'No file chosen';
                preview.style.display = 'none';
                return;
            }
            fileName.textContent = file.name;
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        });
    </script>
</body>
</html>
